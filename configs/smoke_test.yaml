# Micro-TTT Edge Smoke Test Configuration
question: "Can single-step closed-form rank-1 outer-product test-time updates achieve streaming recall on CPU at > 100 tok/s within < 16KB state?"
date: "2026-10-25"

task:
  seq_len: 2048
  vocab_size: 256
  num_passkeys: 1
  batch_size: 2
  seed: 2026

model:
  vocab_size: 256
  d_model: 64
  d_k: 32
  d_v: 32
  d_ff: 128
  num_layers: 2
  lr: 0.10
  decay: 0.999

pre_registered_rules:
  throughput_threshold_tok_s: 100.0
  max_state_kb: 32.0
  max_latency_ms_per_token: 10.0
  pass_rule: "throughput >= 100 tok/s and state <= 32 KB"
